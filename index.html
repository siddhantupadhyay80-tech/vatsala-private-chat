<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Primary SEO Meta Tags -->
    <title>Vatsala — Encrypted 3D Couple Space & Private Calling</title>
    <meta name="title" content="Vatsala — Encrypted 3D Couple Space & Private Calling" />
    <meta name="description" content="Vatsala — Ultra-secure 3D WebGL encrypted private sanctuary for couples. Client-side E2EE HD video calling, voice notes, disappearing photos & secret moments with zero phone number required." />
    <meta name="keywords" content="Vatsala, couple private chat, encrypted video call, e2ee couple space, private photo sharing, secure messenger for couples" />
    <meta name="author" content="Vatsala Private Space" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#07080c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Open Graph / Facebook / WhatsApp Rich Link Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vatsala.space/" />
    <meta property="og:title" content="Vatsala — Private 3D Couple Sanctuary ❤️" />
    <meta property="og:description" content="Pure 256-bit hardware encrypted private calls, disappearing photos & secret moments for couples." />
    <meta property="og:image" content="/favicon.svg" />

    <!-- Twitter Card Preview -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://vatsala.space/" />
    <meta property="twitter:title" content="Vatsala — Private 3D Couple Sanctuary ❤️" />
    <meta property="twitter:description" content="Pure 256-bit hardware encrypted private calls, disappearing photos & secret moments for couples." />
    <meta property="twitter:image" content="/favicon.svg" />

    <!-- Schema.org JSON-LD Structured Data for Google Search Rich Snippets -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Vatsala",
      "applicationCategory": "CommunicationApplication",
      "operatingSystem": "All",
      "description": "Vatsala is a hardware-encrypted 3D WebGL private sanctuary for couples featuring E2EE video calls, voice notes, and disappearing media.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="/src/styles/index.css" />
  </head>
  <body>
    <!-- 3D Three.js Cosmos Canvas Background (Hero Element) -->
    <canvas id="cosmos-canvas"></canvas>

    <!-- Dynamic Session Security Watermark -->
    <div id="session-watermark" class="session-watermark" aria-hidden="true"></div>

    <!-- Hidden Overlays (Guaranteed Hidden) -->
    <div id="privacy-shield" class="privacy-shield" style="display: none !important;">
      <div class="privacy-shield-card">
        <h2>Privacy Shield Active</h2>
        <button id="btn-unblur-screen" class="btn btn-primary">Reveal Screen</button>
      </div>
    </div>

    <div id="camouflage-screen" class="camouflage-screen" style="display: none !important;"></div>

    <!-- Main Application Shell -->
    <div id="app" class="app-root">
      <main class="app-main-layout">
        <div id="chat-component-mount" class="chat-wrapper"></div>
      </main>
    </div>

    <!-- Modals & Overlays Container -->
    <div id="modal-container"></div>
    <div id="call-modal-container"></div>
    <div id="media-viewer-container"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
