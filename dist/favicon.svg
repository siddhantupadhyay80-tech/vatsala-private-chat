<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="nebulaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3366" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#7b2cbf" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0b0c10" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="orbGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366" />
      <stop offset="100%" stop-color="#ff758c" />
    </linearGradient>
    <linearGradient id="orbGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="#0b0c10" />
  <circle cx="50" cy="50" r="45" fill="url(#nebulaGlow)" />
  
  <!-- Orbit Path -->
  <ellipse cx="50" cy="50" rx="36" ry="18" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4" transform="rotate(-25 50 50)" />
  
  <!-- Twin Orbiting Hearts / Star Cores -->
  <circle cx="28" cy="40" r="8" fill="url(#orbGrad1)" filter="drop-shadow(0 0 8px #ff3366)" />
  <circle cx="72" cy="60" r="8" fill="url(#orbGrad2)" filter="drop-shadow(0 0 8px #00f5d4)" />
  
  <!-- Gravitational Wave Connection -->
  <path d="M 28 40 Q 50 25 72 60" stroke="#ff3366" stroke-width="2" fill="none" opacity="0.7" />
  <path d="M 28 40 Q 50 75 72 60" stroke="#00f5d4" stroke-width="2" fill="none" opacity="0.7" />
</svg>
